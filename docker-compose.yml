# ffmpeg-agent 一键部署
# 用法：
#   docker compose up -d --build
#
# .env 可选，只用于非 LLM 配置（UPLOAD/DOWNLOAD/DB_DIR/AUTH_TOKEN 等，见 AGENTS.md）。
# LLM 配置不再从环境变量读取：启动后在页面右上角 ⚙️ 设置弹窗填写即可，
# 服务端会持久化到 backend/data/llm_settings.json（该目录已被 .dockerignore 排除，
# 如需跨容器重建保留配置，可自行加一个卷映射到 /app/backend/data）。
#
# 卷映射使上传/下载文件持久化（容器删除后数据仍在）。
services:
  ffmpeg-agent:
    build: .
    image: ffmpeg-agent:latest
    container_name: ffmpeg-agent
    ports:
      - "8080:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend/upload:/app/backend/upload
      - ./backend/download:/app/backend/download
    restart: unless-stopped
